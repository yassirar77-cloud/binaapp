services:
  - type: web
    name: binaapp-backend
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend

    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      # Force correct Python behavior
      - key: PYTHON_VERSION
        value: "3.11.7"

      # Playwright browser installation enabled in build.sh
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/.cache/ms-playwright"

      # Database
      - key: DATABASE_URL
        sync: false

      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Auth / Security
      - key: JWT_SECRET_KEY
        sync: false

      # AI APIs
      - key: QWEN_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

      # Payments
      - key: STRIPE_SECRET_KEY
        sync: false

      # Email (Zoho SMTP). REQUIRED for the email-verification code to send.
      # Set the secret values in the Render dashboard. If SMTP_USER /
      # SMTP_PASSWORD are missing, /register fails fast (503) rather than
      # creating accounts that never receive their verification code.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOREPLY_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

      # Report Issue → free make-good regeneration (flag-gated, default OFF).
      # Set ISSUE_REPORT_ENABLED=true in the Render dashboard ONLY AFTER
      # applying backend/migrations/052_website_issue_reports.sql to prod
      # Supabase. ISSUE_FREE_REGEN_CAP defaults to 2 when unset.
      - key: ISSUE_REPORT_ENABLED
        sync: false
      - key: ISSUE_FREE_REGEN_CAP
        sync: false

      # App config
      - key: FRONTEND_URL
        value: "https://binaapp.my"
      - key: ENVIRONMENT
        value: "production"

    healthCheckPath: /health
    autoDeploy: true  # Auto-deploy on git push

  - type: cron
    name: binaapp-subscription-cron
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend

    # Daily at 16:00 UTC = 00:00 Malaysia time (UTC+8) the next day
    schedule: "0 16 * * *"

    buildCommand: ./build.sh
    startCommand: python cron_runner.py

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"

      # Safety gate. Set to "false" in the Render dashboard once the first
      # dry-run log has been reviewed.
      - key: SUBSCRIPTION_CRON_DRY_RUN
        value: "true"

      # Supabase (shared with the web service)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Email (used by reminder + lock notice templates)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

      # App config (used to build payment URLs in emails)
      - key: FRONTEND_URL
        value: "https://binaapp.my"
      - key: ENVIRONMENT
        value: "production"

  # Weekly direction stats for designer-grade generation (docs/design/
  # DESIGNER_GRADE_GENERATION.md). Reads the design_plans table (migration
  # 057) and reports the directions with the lowest publish rate. Sunday
  # 16:00 UTC = Monday 00:00 MYT.
  #
  # SUPABASE_SERVICE_ROLE_KEY is inherited from binaapp-backend rather than
  # declared `sync: false`: a `sync: false` key is created EMPTY on this
  # service, so the first runs died with "Missing required environment
  # variables: SUPABASE_SERVICE_ROLE_KEY" even though the web service had
  # it set. Env vars are per-service on Render; `fromService` copies the
  # value across. If the reference ever fails to resolve, set the key on
  # this cron service directly (Dashboard -> binaapp-design-stats ->
  # Environment).
  - type: cron
    name: binaapp-design-stats
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    schedule: "0 16 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_runner.py design-stats
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: SUPABASE_URL
        value: "https://wjaztxkbaeqjabybxhct.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: binaapp-backend
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
