# Build the "how it works" film, then commit it back.
#
# Manual only — this spends money, but only on two of the four shots: 1-idea
# and 4-handover are generated, at roughly USD 0.70 each, about USD 1.40 a run.
# 2-create and 3-site are composited on the runner from the merchant's own
# captures and her live site's hero clip, and cost nothing.
#
# Tick dry_run to read both prompts and download both drawn frames without
# spending anything. The frames are uploaded as the run's artifact either way,
# so they can be judged from a phone before the money is committed.

name: How it works video

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — draw the first frames, print the prompts, spend nothing'
        required: false
        type: boolean
        default: false
      only:
        description: 'Shots to build, comma separated: 1-idea, 2-create, 3-site, 4-handover. Empty builds all four. Only 1-idea and 4-handover cost anything.'
        required: false
        type: string
      seconds:
        description: 'Seconds per shot. The provider allows 5 or 10.'
        required: false
        type: choice
        options: ['5', '10']
        default: '5'
      model:
        description: 'Pin one video model, e.g. wan3.0-video. Empty tries wan3.0-video then happyhorse-1.1-t2v.'
        required: false
        type: string

# The branch the film is committed back to. The workflow itself has to live on
# the default branch for GitHub to offer the "Run workflow" button at all, so
# the branch being built is named here rather than taken from the run's ref.
env:
  TARGET_BRANCH: claude/howitworks-video

permissions:
  contents: write

# Two runs committing to the same branch would race. Never cancel one in
# flight — the clips it has already paid for would be lost.
concurrency:
  group: howitworks-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Four clips, each submitted, polled and downloaded in turn.
    timeout-minutes: 90

    steps:
      - name: Check out the film's branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg, Pillow and httpx
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          # Pillow draws the backdrop and the phone for the two first frames.
          # It is named here rather than relied on: the runner image has
          # carried it, but nothing promises the next one will.
          pip install httpx pillow

      - name: Check the API key is present
        # Skipped on a dry run, which submits nothing. Tests only that the
        # secret is non-empty; the value is never echoed, and GitHub masks it
        # regardless.
        if: ${{ !inputs.dry_run }}
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::error::DASHSCOPE_API_KEY is not set. Add it under" \
                 "Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "DASHSCOPE_API_KEY is set (${#DASHSCOPE_API_KEY} characters)."

      - name: Build the film
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # Through the environment, never interpolated into the script body:
          # these are free text from whoever pressed the button, and ${{ }}
          # inside a run block would make them executable shell.
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
          SECONDS_PER_SHOT: ${{ inputs.seconds }}
          # Empty means "use the built-in chain" — wan3.0-video, then
          # happyhorse-1.1-t2v.
          DASHSCOPE_VIDEO_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          if [ -n "$SECONDS_PER_SHOT" ]; then
            args+=(--seconds "$SECONDS_PER_SHOT")
          fi
          echo "Running: scripts/generate_howitworks_video.py ${args[*]-}"
          python3 scripts/generate_howitworks_video.py ${args[@]+"${args[@]}"}

      - name: Report what was produced
        # Never the step that fails the run: the clips are already paid for by
        # here, and a summary table is not worth losing them over.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          {
            echo '### How it works film'
            echo ''
            echo '| File | Size | Length |'
            echo '|---|---|---|'
            for f in frontend/public/hero/binaapp-howitworks.mp4 \
                     scripts/howitworks_raw/*.mp4 \
                     scripts/howitworks_raw/frames/*.png; do
              [ -e "$f" ] || continue
              len=$(ffprobe -v error -show_entries format=duration \
                    -of default=nw=1:nk=1 "$f" 2>/dev/null || true)
              # printf %f on a non-number exits 1, and `run:` blocks are
              # bash -e — so the duration is checked before it is formatted.
              case "$len" in
                ''|*[!0-9.]*) len='—' ;;
                *)            len="$(printf '%.1fs' "$len")" ;;
              esac
              printf '| %s | %s | %s |\n' "$f" "$(du -h "$f" | cut -f1)" "$len"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded before the commit, so the film survives even if the push
      # fails. The per-shot masters go up too — judging one shot means watching
      # that shot, not the whole cut — and so do the two first frames, which
      # are the only thing a dry run produces and the whole point of one.
      - name: Upload the film and the first frames
        # !cancelled() rather than success(): if anything after generation
        # fails, whatever was rendered still leaves the runner. Not gated on
        # dry_run — a dry run has frames worth downloading.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: howitworks-video-${{ github.run_number }}
          path: |
            frontend/public/hero/binaapp-howitworks.mp4
            frontend/public/hero/binaapp-howitworks.jpg
            scripts/howitworks_raw/*.mp4
            scripts/howitworks_raw/frames/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Commit the film back to the branch
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- frontend/public/hero

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git diff --cached --name-only

          git commit -m "Add the how it works film" \
            -m "Generated by the How it works video workflow (run ${{ github.run_number }})." \
            -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"

          # Someone may have pushed while the clips rendered. Rebase onto
          # whatever is there rather than failing after paying for the footage.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Pushed to ${TARGET_BRANCH}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto the branch."
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
          done

          echo "::error::Could not push to ${TARGET_BRANCH} after 3 attempts." \
               "The film is still available as the run's artifact."
          exit 1
