name: Golden sites

# Five fixture merchants built end to end (generate → widgets → visual
# gate). Offline on every PR that touches the generator, its guards or the
# fixtures (no model keys: library theme + fallback copy, the exact composed
# layout, the full measured gate). Live nightly with the real models, images
# and the vision review when the repository has the model keys (offline,
# with a warning, when it does not). Screenshots, diffs and reports are kept as
# artifacts; a failing golden site fails the job. Add "golden" to the
# required checks of main so a regression cannot merge.

on:
  pull_request:
    paths:
      - "backend/app/services/**"
      - "backend/app/main.py"
      - "backend/scripts/golden_run.py"
      - "backend/scripts/gate_calibration.py"
      - "backend/scripts/gate_selftest.py"
      - "backend/scripts/verify_site_menu.py"
      - "backend/tests/golden/**"
      - "backend/requirements.txt"
      - ".github/workflows/golden.yml"
  schedule:
    - cron: "17 19 * * *"   # 03:17 MYT nightly
  workflow_dispatch:
    inputs:
      mode:
        description: "offline or live"
        default: "live"
        required: true

jobs:
  golden:
    name: golden
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BINAAPP_PAGE_MODE: deterministic
      VISUAL_GATE_MODE: enforce
      DESIGN_PLAN_STORE_ENABLED: "false"
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      JWT_SECRET_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      # The nightly run is live only when this repository has the model
      # keys (Settings → Secrets and variables → Actions). Without them it
      # runs offline and says so: a "live" run that silently builds offline
      # pages would report a success it did not earn. A live run asked for
      # by hand with no keys fails instead (golden_run.py refuses to start).
      - name: Decide mode
        id: mode
        env:
          HAS_LIVE_KEYS: ${{ secrets.QWEN_API_KEY != '' && (secrets.ZAI_API_KEY != '' || secrets.STABILITY_API_KEY != '') }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "mode=offline" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT";
          elif [ "$HAS_LIVE_KEYS" = "true" ]; then echo "mode=live" >> "$GITHUB_OUTPUT";
          else
            echo "mode=offline" >> "$GITHUB_OUTPUT"
            echo "::warning::Nightly golden run is OFFLINE: this repository has no model keys in its Actions secrets (QWEN_API_KEY plus ZAI_API_KEY or STABILITY_API_KEY). The real models, AI photos and the vision reviewer were not exercised."
            echo "### Nightly run was offline: no model keys in this repository's Actions secrets" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The gate's own test: one planted defect per check must be caught
      # (and repaired where the gate has a fix), and the clean page must
      # raise nothing. A check that stops firing fails the job.
      - name: Calibrate the visual gate (22 planted defects)
        working-directory: backend
        run: python scripts/gate_calibration.py

      - name: Build the golden sites
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ steps.mode.outputs.mode == 'live' && secrets.DEEPSEEK_API_KEY || '' }}
          QWEN_API_KEY: ${{ steps.mode.outputs.mode == 'live' && secrets.QWEN_API_KEY || '' }}
          ZAI_API_KEY: ${{ steps.mode.outputs.mode == 'live' && secrets.ZAI_API_KEY || '' }}
          STABILITY_API_KEY: ${{ steps.mode.outputs.mode == 'live' && secrets.STABILITY_API_KEY || '' }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || (secrets.ZAI_API_KEY != '' && 'zai' || 'stability') }}
          CLOUDINARY_CLOUD_NAME: ${{ steps.mode.outputs.mode == 'live' && secrets.CLOUDINARY_CLOUD_NAME || '' }}
          CLOUDINARY_API_KEY: ${{ steps.mode.outputs.mode == 'live' && secrets.CLOUDINARY_API_KEY || '' }}
          CLOUDINARY_API_SECRET: ${{ steps.mode.outputs.mode == 'live' && secrets.CLOUDINARY_API_SECRET || '' }}
          FREE_AI_IMAGES_PER_SITE: "3"
        run: python scripts/golden_run.py --mode ${{ steps.mode.outputs.mode }} --out golden-out

      - name: Keep the screenshots, diffs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
          path: backend/golden-out
          retention-days: 30
