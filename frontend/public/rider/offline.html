<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #131826;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { color: #ffffff; margin-bottom: 10px; font-size: 24px; }
    p { color: #a5adbf; margin-bottom: 24px; }
    button {
      background: #C7FF3D;
      color: #000000;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #B5EE2A; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛵</div>
    <h1>Tiada Sambungan Internet</h1>
    <p>Anda perlu internet untuk menerima pesanan.</p>
    <button onclick="window.location.reload()">Cuba Lagi</button>
  </div>
</body>
</html>
